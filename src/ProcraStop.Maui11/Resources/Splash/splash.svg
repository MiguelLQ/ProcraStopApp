<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Splash NATIVO de Android (Maui.SplashTheme):
     · Fondo: Color/DarkColor de <MauiSplashScreen> en el csproj.
     · Ícono: ESTE SVG rasterizado y centrado. En Android 12+ el ícono se
       enmascara en un círculo (tercio interno visible) → el cuadrado
       redondeado está diseñado DENTRO de ese círculo seguro
       (semi-diagonal 126 < radio de máscara 152): las esquinas del
       cuadrado NO se recortan.
     · Nombre + versión: windowSplashScreenBrandingImage
       (drawable-xxhdpi/splash_branding.png), ver Platforms/Android/
       Resources/values/styles.xml.
     Docs: developer.android.com/develop/ui/views/launch/splash-screen -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <!-- Cuadrado blanco con esquinas redondeadas (badge estilo app-icon) -->
    <rect x="124" y="124" width="208" height="208" rx="50" style="fill:#ffffff;" />
    <!-- Monograma "P" de ProcraStop en PrimaryLight #4075FF,
         escalado 0.56 y centrado ópticamente en el cuadrado -->
    <g transform="translate(91.36,99.2) scale(0.56)">
        <path d="M148,124 H248 C304,124 340,158 340,212 C340,266 304,300 248,300 H204 V336 H148 Z M204,176 V248 H242 C266,248 282,234 282,212 C282,190 266,176 242,176 Z" style="fill:#4075FF;fill-rule:evenodd;" />
    </g>
</svg>
